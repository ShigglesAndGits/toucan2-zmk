# Config for keymap-drawer (https://github.com/caksoylar/keymap-drawer).
# Regenerate the diagram after keymap changes:
#   keymap -c keymap_drawer.config.yaml parse -z config/toucan.keymap -o toucan.yaml
#   keymap -c keymap_drawer.config.yaml draw toucan.yaml -d boards/shields/toucan/toucan.dtsi -o keymap.svg
parse_config:
  raw_binding_map:
    "&td_layer_work": {t: "RAISE", s: "x2 WORK"}
    "&mkp MB1": "LMB"
    "&mkp MB2": "RMB"
    "&mkp MB3": "MMB"
    "&mkp MB4": "MB4"
    "&mkp MB5": "MB5"
